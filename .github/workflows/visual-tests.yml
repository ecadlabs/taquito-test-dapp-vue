name: run playwright tests
on:
  # push:
  #   branches: [ main ]
  # pull_request:
  workflow_dispatch:
jobs:
  test:
    environment: ${{ matrix.environment }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - environment: shadownet
          - environment: ushuaianet
    env:
      VITE_NETWORK_TYPE: ${{ matrix.environment }}
      VITE_RPC_URL: ${{ vars.RPC_URL }}
      WALLET_PRIVATE_KEY: ${{ secrets.WALLET_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Originate Counter Contract
        run: npm run originate ${{ secrets.WALLET_PRIVATE_KEY }}
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        run: npx playwright test staking.spec.ts
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
            test-results/**/*.zip
            test-results/**/*.webm
          retention-days: 15
